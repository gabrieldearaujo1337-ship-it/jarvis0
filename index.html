<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI</title>
  <style>
    body { margin: 0; background: #050505; color: #00d4ff; font-family: 'Courier New', monospace; overflow: hidden; }
    
    /* Layout */
    .container { display: flex; height: 100vh; align-items: center; justify-content: center; gap: 40px; }
    
    /* Webcam */
    #webcam { width: 320px; height: 240px; background: #111; border: 2px solid #00d4ff; border-radius: 10px; object-fit: cover; box-shadow: 0 0 20px #00d4ff44; }
    
    /* Avatar (Busto Visual) */
    #avatar { width: 300px; height: 300px; position: relative; display: flex; align-items: center; justify-content: center; }
    .circle { position: absolute; border-radius: 50%; border: 2px solid #00d4ff; transition: all 0.3s ease; }
    .core { width: 80px; height: 80px; background: #00d4ff; box-shadow: 0 0 30px #00d4ff; animation: pulse 2s infinite; }
    .ring { width: 150px; height: 150px; border: 1px dashed #00d4ff; animation: spin 10s linear infinite; }
    .ring-thick { width: 220px; height: 220px; border: 4px solid transparent; border-top: 4px solid #00d4ff; animation: spin 3s linear infinite; }

    /* Estados do Avatar */
    #avatar.listening .core { background: #ff6b00; box-shadow: 0 0 30px #ff6b00; animation: pulse 0.5s infinite; }
    #avatar.listening .ring { border-color: #ff6b00; }
    #avatar.speaking .core { background: #00ff41; box-shadow: 0 0 50px #00ff41; transform: scale(1.2); }
    #avatar.speaking .ring { border-color: #00ff41; animation-duration: 1s; }

    /* Status e Resposta */
    #status { position: absolute; top: 20px; left: 0; right: 0; text-align: center; font-size: 1.2em; opacity: 0.8; }
    #response { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center; max-width: 600px; font-size: 1.1em; color: #00ff41; }

    /* Animações */
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="status">Iniciando JARVIS...</div>
  
  <div class="container">
    <video id="webcam" autoplay playsinline muted></video>
    <div id="avatar">
      <div class="circle ring-thick"></div>
      <div class="circle ring"></div>
      <div class="circle core"></div>
    </div>
  </div>

  <div id="response"></div>

  <script>
    // --- CONFIG ---
    const WORKER_URL = 'https://jarvis-proxy.gabrieldearaujo1337.workers.dev';

    // --- ELEMENTOS ---
    const webcam = document.getElementById('webcam');
    const avatar = document.getElementById('avatar');
    const statusEl = document.getElementById('status');
    const responseEl = document.getElementById('response');

    // --- WEBCAM ---
    async function enableWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        webcam.srcObject = stream;
      } catch (err) {
        statusEl.textContent = 'Webcam bloqueada. Permita nas configurações do navegador.';
      }
    }
    enableWebcam();

    // --- VOZ (TTS) ---
    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'pt-BR';
      u.pitch = 0.8; // Mais grave
      u.rate = 1.1;
      const voices = speechSynthesis.getVoices();
      const ptVoice = voices.find(v => v.lang.startsWith('pt'));
      if (ptVoice) u.voice = ptVoice;
      
      u.onstart = () => { avatar.classList.add('speaking'); avatar.classList.remove('listening'); };
      u.onend = () => { 
        avatar.classList.remove('speaking'); 
        startListening(); 
      };
      speechSynthesis.speak(u);
    }

    // --- ESCUTA (STT) ---
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (!SR) {
      statusEl.textContent = 'Navegador não suporta voz. Use Chrome.';
    } else {
      recognition = new SR();
      recognition.lang = 'pt-BR';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        avatar.classList.add('listening');
        avatar.classList.remove('speaking');
        statusEl.textContent = '🎙️ Ouvindo...';
      };

      recognition.onresult = (e) => {
        const transcript = Array.from(e.results).find(r => r.isFinal)?.[0]?.transcript;
        if (transcript) {
          responseEl.textContent = 'Você: ' + transcript;
          handleCommand(transcript);
        }
      };

      recognition.onerror = (e) => {
        if (e.error === 'not-allowed') {
          statusEl.textContent = '❌ Microfone bloqueado!';
          avatar.classList.remove('listening');
          isListening = false;
        } else if (e.error !== 'no-speech') {
          statusEl.textContent = 'Erro voz: ' + e.error;
        }
      };

      recognition.onend = () => {
        // Reinicia automaticamente, exceto se o usuário parou manualmente
        if (isListening) startListening();
      };

      startListening();
    }

    function startListening() {
      if (isListening) return;
      isListening = true;
      try { recognition.start(); } catch {}
    }

    // --- PROCESSAMENTO ---
    async function handleCommand(userText) {
      avatar.classList.remove('listening');
      statusEl.textContent = 'JARVIS processando...';
      
      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: userText })
        });

        const raw = await res.text();
        let data = {};
        if (raw) {
          try { data = JSON.parse(raw); } catch { data = { error: 'Resposta inválida' }; }
        } else {
          data = { error: 'Resposta vazia' };
        }

        if (!res.ok || data.error) {
          responseEl.textContent = '⚠️ ' + (data.error || 'Erro');
          statusEl.textContent = 'Erro no servidor.';
          startListening();
        } else {
          const reply = data.text || 'Não entendi.';
          responseEl.textContent = reply;
          speak(reply);
        }
      } catch (err) {
        responseEl.textContent = 'Erro de conexão: ' + err.message;
        statusEl.textContent = 'Falha na rede.';
        startListening();
      }
    }
  </script>
</body>
</html>
