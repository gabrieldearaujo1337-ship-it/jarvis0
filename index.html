<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <style>
    body {
      background: #050505;
      color: #00d4ff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    #reator {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, #00d4ff, #002b33);
      border: 3px solid #00d4ff;
      cursor: pointer;
      box-shadow: 0 0 30px #00d4ff, 0 0 60px #00d4ff44;
      transition: all 0.3s;
    }
    #reator.speaking {
      box-shadow: 0 0 50px #00ff41, 0 0 100px #00ff4166;
      border-color: #00ff41;
      background: radial-gradient(circle, #00ff41, #003b00);
    }
    #reator.listening {
      animation: pulse 1s infinite;
      box-shadow: 0 0 40px #ff6b00, 0 0 80px #ff6b0044;
      border-color: #ff6b00;
    }
    #status {
      margin-top: 25px;
      font-size: 0.9em;
      opacity: 0.7;
    }
    #response {
      margin-top: 15px;
      max-width: 600px;
      text-align: center;
      font-size: 1.15em;
      min-height: 60px;
      padding: 10px;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
  </style>
</head>
<body>
  <div id="reator"></div>
  <div id="status">JARVIS escutando...</div>
  <div id="response"></div>

  <script>
    const WORKER_URL = 'https://jarvis-proxy.gabrieldearaujo1337.workers.dev';
    const reator = document.getElementById('reator');
    const statusEl = document.getElementById('status');
    const responseEl = document.getElementById('response');

    // --- FALA (TTS) ---
    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'pt-BR';
      u.rate = 1.05;
      u.pitch = 0.85;
      const voices = speechSynthesis.getVoices();
      const ptVoice = voices.find(v => v.lang.startsWith('pt'));
      if (ptVoice) u.voice = ptVoice;
      u.onstart = () => reator.classList.add('speaking');
      u.onend = () => {
        reator.classList.remove('speaking');
        // Volta a escutar depois de falar
        setTimeout(() => startListening(), 300);
      };
      speechSynthesis.speak(u);
    }

    // --- ESCUTA CONTÍNUA (STT) ---
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (!SR) {
      statusEl.textContent = 'Seu navegador não suporta voz. Use Chrome ou Edge.';
    } else {
      recognition = new SR();
      recognition.lang = 'pt-BR';
      recognition.interimResults = false;
      recognition.continuous = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        reator.classList.add('listening');
        statusEl.textContent = '🎙️ Ouvindo...';
      };

      recognition.onresult = (e) => {
        let transcript = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) {
            transcript = e.results[i][0].transcript.trim();
          }
        }
        if (!transcript) return;

        responseEl.textContent = 'Você: ' + transcript;
        handleCommand(transcript);
      };

      recognition.onerror = (e) => {
        if (e.error === 'not-allowed') {
          statusEl.textContent = '❌ Microfone bloqueado! Permita no cadeado da URL.';
          reator.classList.remove('listening');
          isListening = false;
        } else if (e.error === 'no-speech') {
          // Silencioso, continua ouvindo
        } else {
          statusEl.textContent = 'Erro: ' + e.error;
        }
      };

      recognition.onend = () => {
        // Reinicia automaticamente (alguns navegadores fecham após silêncio)
        if (isListening) {
          try { recognition.start(); } catch {}
        }
      };

      // Começa a escutar assim que a página carrega
      try { recognition.start(); } catch (err) {
        statusEl.textContent = 'Clique no reator para ativar o áudio.';
        reator.onclick = () => {
          try { recognition.start(); } catch {}
        };
      }
    }

    // --- COMANDA ---
    async function handleCommand(userText) {
      // Reinicia escuta imediatamente para não perder a próxima fala
      if (isListening) {
        recognition.stop();
        isListening = false;
        setTimeout(() => startListening(), 200);
      }

      statusEl.textContent = 'JARVIS processando...';
      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: userText })
        });
        const data = await res.json();
        const reply = data.text || 'Erro ao contactar JARVIS.';
        responseEl.textContent = reply;
        statusEl.textContent = 'JARVIS respondeu:';
        speak(reply);
      } catch (err) {
        responseEl.textContent = 'Erro: ' + err.message;
        statusEl.textContent = 'Falha na conexão.';
      }
    }

    function startListening() {
      if (isListening) return;
      isListening = true;
      try { recognition.start(); } catch {}
    }
  </script>
</body>
</html>
